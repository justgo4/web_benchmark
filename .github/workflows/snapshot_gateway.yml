name: Snapshot gateway benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - snapshot_gateway_apps.py
      - snapshot_gateway_benchmark.py
      - .github/workflows/snapshot_gateway.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastpysgi "granian[uvloop,rloop]" sanic
          go install github.com/tsenart/vegeta/v12@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run snapshot gateway benchmark
        run: python snapshot_gateway_benchmark.py

      - name: Show result
        if: always()
        run: |
          test -f SNAPSHOT_GATEWAY_BENCHMARK.md && cat SNAPSHOT_GATEWAY_BENCHMARK.md || true
          test -f results/snapshot_gateway_latest.json && cat results/snapshot_gateway_latest.json || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-gateway-${{ github.run_id }}
          path: |
            SNAPSHOT_GATEWAY_BENCHMARK.md
            results/snapshot_gateway_latest.json
            results/snapshot_gateway_logs/
          if-no-files-found: warn

      - name: Commit result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SNAPSHOT_GATEWAY_BENCHMARK.md results/snapshot_gateway_latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Record snapshot gateway benchmark [skip ci]"
          git push
