name: Python HTTP benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - RESULTS.md
      - CLIENT_RESULTS.md
      - STARROCKS_BENCHMARK.md
      - DASHBOARD_BENCHMARK.md
      - dashboard_*.py
      - .github/workflows/dashboard.yml
      - results/**

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCH_ROUNDS: "3"
      BENCH_DURATION: "6"
      BENCH_CONNECTIONS: "128"
      BENCH_THREADS: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install benchmark tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk
          python -m pip install --upgrade uv

      - name: Run benchmark
        run: python benchmark.py

      - name: Install outbound client benchmark libraries
        run: python -m pip install --upgrade aiohttp httpx pyreqwest pyqwest fastpysgi uvloop

      - name: Run outbound HTTP client benchmark
        run: python proxy_benchmark.py

      - name: Run realistic StarRocks gateway benchmark
        env:
          REAL_BENCH_ROUNDS: "2"
          REAL_BENCH_DURATION: "4"
          REAL_BENCH_CONNECTIONS: "128"
          REAL_BENCH_THREADS: "2"
        run: python real_benchmark.py

      - name: Show result
        if: always()
        run: |
          test -f RESULTS.md && cat RESULTS.md || true
          test -f CLIENT_RESULTS.md && cat CLIENT_RESULTS.md || true
          test -f STARROCKS_BENCHMARK.md && cat STARROCKS_BENCHMARK.md || true
          test -f results/latest.json && cat results/latest.json || true
          test -f results/client_latest.json && cat results/client_latest.json || true

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-http-benchmark-${{ github.run_id }}
          path: |
            RESULTS.md
            CLIENT_RESULTS.md
            STARROCKS_BENCHMARK.md
            results/
          if-no-files-found: warn

      - name: Commit measured result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESULTS.md CLIENT_RESULTS.md STARROCKS_BENCHMARK.md results/latest.json results/client_latest.json results/starrocks_latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Record HTTP benchmark results [skip ci]"
          git push
