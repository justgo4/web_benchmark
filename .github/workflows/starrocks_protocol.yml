name: StarRocks 4.1.1 protocol benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - starrocks_protocol_benchmark.py
      - .github/workflows/starrocks_protocol.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show disk space
        run: df -h

      - name: Free disk space if needed
        shell: bash
        run: |
          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "${FREE_GB}" -lt 12 ]; then
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
            docker system prune -af || true
          fi
          df -h

      - name: Install benchmark clients
        run: |
          python -m pip install --upgrade pip
          python -m pip install             pymysql             pyreqwest             adbc-driver-manager             adbc-driver-flightsql             pyarrow

      - name: Start StarRocks 4.1.1 with Arrow Flight and Query Cache
        shell: bash
        run: |
          docker pull starrocks/allin1-ubuntu:4.1.1
          docker run -d             --name starrocks             -p 8030:8030             -p 8040:8040             -p 9030:9030             -p 9408:9408             -p 9419:9419             -e 'JAVA_TOOL_OPTIONS=--add-opens=java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED'             starrocks/allin1-ubuntu:4.1.1             bash -lc '
              echo "arrow_flight_port = 9408" >> /data/deploy/starrocks/fe/conf/fe.conf
              echo "arrow_flight_port = 9419" >> /data/deploy/starrocks/be/conf/be.conf
              echo "query_cache_capacity = 536870912" >> /data/deploy/starrocks/be/conf/be.conf
              exec ./entrypoint.sh
            '
          docker ps -a

      - name: Run protocol benchmark
        env:
          SR_BENCH_ROWS: "1000000"
          SR_BENCH_SIZES: "10,100,1000,10000,100000,500000"
          SR_BENCH_ROUNDS: "5"
          SR_BENCH_JSON_ROUNDS: "3"
        run: python starrocks_protocol_benchmark.py

      - name: Show benchmark result
        if: always()
        run: |
          test -f STARROCKS_PROTOCOL_BENCHMARK.md && cat STARROCKS_PROTOCOL_BENCHMARK.md || true
          test -f results/starrocks_protocol_latest.json && cat results/starrocks_protocol_latest.json || true

      - name: Capture StarRocks diagnostics
        if: always()
        run: |
          mkdir -p results/starrocks_logs
          docker logs starrocks > results/starrocks_logs/container.log 2>&1 || true
          docker exec starrocks bash -lc 'tail -n 300 /data/deploy/starrocks/fe/log/fe.log'             > results/starrocks_logs/fe.log 2>&1 || true
          docker exec starrocks bash -lc 'tail -n 300 /data/deploy/starrocks/be/log/be.INFO'             > results/starrocks_logs/be.log 2>&1 || true
          curl -s http://127.0.0.1:8040/metrics | grep query_cache             > results/starrocks_logs/query_cache_metrics.txt || true
          df -h > results/starrocks_logs/disk.txt || true
          docker ps -a > results/starrocks_logs/docker_ps.txt || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starrocks-protocol-${{ github.run_id }}
          path: |
            STARROCKS_PROTOCOL_BENCHMARK.md
            results/starrocks_protocol_latest.json
            results/starrocks_logs/
          if-no-files-found: warn

      - name: Commit benchmark result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STARROCKS_PROTOCOL_BENCHMARK.md results/starrocks_protocol_latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Record StarRocks 4.1.1 protocol benchmark [skip ci]"
          git push
