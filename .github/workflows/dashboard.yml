name: Dashboard 4000 QPS benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dashboard_*.py
      - .github/workflows/dashboard.yml

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install benchmark tools
        run: |
          python -m pip install --upgrade uv "uvicorn[standard]"
          go install github.com/tsenart/vegeta/v12@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          ulimit -n 65535

      - name: Run exact dashboard workload
        env:
          DASHBOARD_STEADY_SECONDS: "3"
          DASHBOARD_STEADY_ROUNDS: "1"
          DASHBOARD_BURST_ROUNDS: "0"
          DASHBOARD_DELAYS_MS: "2,5"
        run: python dashboard_benchmark.py

      - name: Show result
        if: always()
        run: |
          test -f DASHBOARD_BENCHMARK.md && cat DASHBOARD_BENCHMARK.md || true
          test -f results/dashboard_latest.json && cat results/dashboard_latest.json || true

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-benchmark-${{ github.run_id }}
          path: |
            DASHBOARD_BENCHMARK.md
            results/dashboard_latest.json
            results/dashboard_logs/
          if-no-files-found: warn

      - name: Commit result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DASHBOARD_BENCHMARK.md results/dashboard_latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Record dashboard 4000-QPS benchmark [skip ci]"
          git push
